name: Bump varlatch

# Opens the Formula/varlatch.rb bump for each new varlatch/varlatch release and
# merges it once CI passes. The tap polls instead of the release workflow
# pushing here, so no credential for this repository sits in that workflow.
#
# Nothing is proposed unless SHA256SUMS carries the release workflow's Sigstore
# signature for that exact tag and every native binary the formula installs
# (macOS and Linux, Intel and ARM) matches it. To skip a bad release,
# close its pull request: a closed one is never opened again.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-varlatch

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open and merge the pull request
      actions: write # start CI, see below
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: varlatch/varlatch
      FORMULA: Formula/varlatch.rb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare the newest release with the formula
        id: check
        run: |
          latest=$(gh release view --repo "$RELEASES" --json tagName --jq .tagName)
          latest=${latest#v}
          # Every url line names the same release.
          current=$(sed -nE 's|^ *url ".*/download/v([^/]+)/varlatch-.*|\1|p' "$FORMULA" | sort -u)
          for v in "$latest" "$current"; do
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Not a release version: '$v'"
              exit 1
            fi
          done
          newest=$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -n 1)
          if [ "$latest" = "$current" ] || [ "$newest" != "$latest" ]; then
            echo "Nothing to do: the formula is at $current, the newest release is $latest."
            exit 0
          fi

          branch="chore/varlatch-$latest"
          state=$(gh pr list --head "$branch" --state all --json state --jq '.[0].state // ""')
          case "$state" in
            OPEN)
              # A scheduled run's failure notifies the maintainers; a failed
              # check on the pull request alone notifies nobody.
              failed=$(gh pr list --head "$branch" --state open --json statusCheckRollup \
                --jq '[.[0].statusCheckRollup[]? | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .conclusion == "CANCELLED")] | length')
              if [ "$failed" != 0 ]; then
                echo "::error::CI failed on the pull request for varlatch $latest, so it is not merged."
                exit 1
              fi
              echo "The pull request for varlatch $latest is waiting for CI."
              exit 0
              ;;
            CLOSED)
              echo "Skipping varlatch $latest: its pull request was closed."
              exit 0
              ;;
          esac
          {
            echo "bump=true"
            echo "version=$latest"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: steps.check.outputs.bump == 'true'

      - name: Verify the release
        id: verify
        if: steps.check.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          dir=$(mktemp -d)
          gh release download "v$VERSION" --repo "$RELEASES" --dir "$dir" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json \
            --pattern "varlatch-$VERSION-darwin-*" --pattern "varlatch-$VERSION-linux-*"
          cosign verify-blob "$dir/SHA256SUMS" --bundle "$dir/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/$RELEASES/.github/workflows/release.yml@refs/tags/v$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            cli="varlatch-$VERSION-$platform"
            signed=$(awk -v f="$cli" '$2 == f { print $1 }' "$dir/SHA256SUMS")
            actual=$(sha256sum "$dir/$cli" | cut -d' ' -f1)
            if ! [[ "$signed" =~ ^[0-9a-f]{64}$ ]] || [ "$signed" != "$actual" ]; then
              echo "::error::$cli does not match the signed SHA256SUMS."
              exit 1
            fi
          done
          echo "sums=$dir/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.check.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          BRANCH: ${{ steps.check.outputs.branch }}
          SUMS: ${{ steps.verify.outputs.sums }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Each url line to this release's binary for its platform, and the
          # sha256 line after it to that binary's signed checksum.
          python3 - "$FORMULA" "$VERSION" "$SUMS" <<'PY'
          import re, sys
          formula, version, sums = sys.argv[1:]
          signed = {}
          for line in open(sums):
              parts = line.split()
              if len(parts) == 2:
                  signed[parts[1].lstrip("*")] = parts[0]
          out, asset = [], None
          for line in open(formula):
              m = re.match(r'(\s*url ")(https://github\.com/varlatch/varlatch/releases/download/)v[^/]+/varlatch-[^/"]+-(darwin|linux)-(amd64|arm64)(")', line)
              if m:
                  asset = f"varlatch-{version}-{m.group(3)}-{m.group(4)}"
                  line = f'{m.group(1)}{m.group(2)}v{version}/{asset}{m.group(5)}\n'
              elif asset and re.match(r'\s*sha256 "[0-9a-f]{64}"', line):
                  line = re.sub(r'"[0-9a-f]{64}"', f'"{signed[asset]}"', line)
                  asset = None
              out.append(line)
          open(formula, "w").write("".join(out))
          PY
          if [ "$(git diff --numstat -- "$FORMULA" | cut -f1,2)" != "$(printf '8\t8')" ]; then
            echo "::error::Expected to change exactly the four url and four sha256 lines."
            git diff -- "$FORMULA"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "varlatch $VERSION"
          git push --force origin "$BRANCH"

          # An older bump still open is one whose CI failed: this one replaces it.
          gh pr list --state open --author app/github-actions --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/varlatch-")) | .number' |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Replaced by varlatch $VERSION."
            done

          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "varlatch $VERSION" --body "$(cat <<BODY
          Update the Varlatch CLI formula to [v$VERSION](https://github.com/$RELEASES/releases/tag/v$VERSION).

          [This run]($RUN_URL) checked the Sigstore signature on \`SHA256SUMS\` for the release workflow at that tag, and each \`varlatch-$VERSION-<os>-<arch>\` binary the formula installs against \`SHA256SUMS\`.

          This merges by itself once CI passes. Close it to skip this release.
          BODY
          )")

          # A pull request opened with GITHUB_TOKEN starts no pull_request
          # workflows, but workflow_dispatch does run: the check lands on the
          # same commit, where the ruleset on main requires it before merging.
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$url" --auto --squash
