name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by bump-varlatch.yml: its pull requests trigger no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Homebrew reads a prerelease's file name (varlatch-0.50.0-rc.1-...)
      # as version 0.50.0-rc, so a formula pointing at one cannot install.
      - name: varlatch points at a final release
        run: |
          versions="$(grep -oE 'download/v[^/"]+' Formula/varlatch.rb | sed 's|^download/v||' | sort -u)"
          if [ -z "$versions" ]; then
            echo "::error file=Formula/varlatch.rb::no download/v<version> URL found"
            exit 1
          fi
          bad=0
          for v in $versions; do
            if ! printf '%s\n' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error file=Formula/varlatch.rb::v$v points at a prerelease: re-point at a final release before merging"
              bad=1
            fi
          done
          exit "$bad"
      - name: Tap this checkout
        run: |
          brew update
          tap="$(brew --repository)/Library/Taps/varlatch/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          # Homebrew loads formulae from other taps only once trusted.
          brew trust varlatch/tap
          brew --version
      - name: brew style
        run: brew style varlatch/tap
      - name: brew audit
        run: |
          for f in Formula/*.rb; do
            brew audit --strict --online "varlatch/tap/$(basename "$f" .rb)"
          done
      - name: Install from source
        run: |
          for f in Formula/*.rb; do
            brew install --build-from-source "varlatch/tap/$(basename "$f" .rb)"
          done
      - name: brew test
        run: |
          for f in Formula/*.rb; do
            brew test "varlatch/tap/$(basename "$f" .rb)"
          done
